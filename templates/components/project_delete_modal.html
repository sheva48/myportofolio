<dialog id="delete-modal-{{ project.id }}" class="project-delete-modal">
    <div class="project-delete-modal__body">
        <p>Yakin mau menghapus proyek <strong>{{ project.title }}</strong>?</p>
        <div class="project-delete-modal__actions">
            <button
                type="button"
                class="button button-secondary"
                onclick="document.getElementById('delete-modal-{{ project.id }}').close()"
            >Batal</button>
            <form method="post" action="{% url 'main:delete_project' project.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Hapus</button>
            </form>
        </div>
    </div>
</dialog>
