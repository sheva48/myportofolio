<dialog id="delete-education-modal-{{ education.id }}" class="project-delete-modal">
    <div class="project-delete-modal__body">
        <p>Yakin mau menghapus riwayat pendidikan di <strong>{{ education.institution_name }}</strong>?</p>
        <div class="project-delete-modal__actions">
            <button
                type="button"
                class="button button-secondary"
                onclick="document.getElementById('delete-education-modal-{{ education.id }}').close()"
            >Batal</button>
            <form method="post" action="{% url 'main:delete_education' education.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Hapus</button>
            </form>
        </div>
    </div>
</dialog>
